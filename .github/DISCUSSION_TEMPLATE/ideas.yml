# Modified by flockr (https://github.com/Rambarani/flockr): changed from herdr v0.9.5 (Apache-2.0). See NOTICE.
title: "[idea] "
body:
  - type: textarea
    id: idea
    attributes:
      label: idea / problem
      description: what do you want to do, or what feels awkward today?
    validations:
      required: true

  - type: textarea
    id: requested-change
    attributes:
      label: requested change
      description: what would you like flockr to support?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: why you want this
      description: how would this help you?
    validations:
      required: true
