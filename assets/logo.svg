<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="flockr">
  <title>flockr</title>
  <rect width="256" height="256" rx="56" fill="#1e1b3a"/>
  <!-- a small flock: three rounded panes, each an agent -->
  <rect x="38" y="52" width="86" height="72" rx="18" fill="#2dd4bf"/>
  <rect x="132" y="52" width="86" height="72" rx="18" fill="#818cf8"/>
  <rect x="84" y="132" width="88" height="72" rx="18" fill="#fbbf24"/>
  <!-- terminal prompt on the front pane -->
  <path d="M106 152 l20 16 l-20 16" fill="none" stroke="#1e1b3a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="134" y="176" width="22" height="9" rx="4.5" fill="#1e1b3a"/>
  <!-- state dots: working, idle -->
  <circle cx="64" cy="78" r="9" fill="#1e1b3a"/>
  <circle cx="158" cy="78" r="9" fill="none" stroke="#1e1b3a" stroke-width="5"/>
</svg>
