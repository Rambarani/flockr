# Hourly workbox sync, with the today list shown in the Flockr sidebar.
#
# `flockr job new workbox-sync --template workbox` writes this file (and
# prompt.md) to ~/.config/flockr/jobs/workbox-sync/ (debug builds use
# ~/.config/flockr-dev/jobs/...). Check it with `flockr job validate
# workbox-sync`, try it with `flockr job run workbox-sync --dry-run`, then
# switch it on with `flockr job enable workbox-sync`. See README.md next to
# this file.

title = "workbox sync"
command = ["workbox", "sync"]
every = "1h"
timeout = "10m"
enabled = false                     # created disabled; `flockr job enable workbox-sync` turns it on
notify = "on_failure"

# The feed command runs after every successful sync, on demand
# (`flockr feed refresh workbox-sync`, or R in the Feed overlay), and once
# when the server starts if the feed has never been read. It prints the
# JSON array of `workbox list --json`, which `flockr feed adapt workbox`
# turns into a feed: unread items get a dot, Enter or a click opens the link,
# and each item has done (d), seen (s), today (t) and delete (D, asks y/n first)
# actions that run `workbox mark`. `--include-done` adds items marked done in
# the last 7 days (`--done-days N`), shown in a last Done tab with an undo (u)
# action.
[feed]
command = ["sh", "-c", "workbox list --json --include-done | flockr feed adapt workbox --title 'Today (workbox)'"]
title = "Today (workbox)"

# Only the items on the today tab:
# command = ["sh", "-c", "workbox list --tab today --json | flockr feed adapt workbox --title 'Today (workbox)'"]

# Work on items: in the Feed overlay (prefix+f) mark items with `x` (or
# ctrl-click), then press `w` (the current item when none is marked). Flockr
# opens a tab and starts the agent with the items as the prompt. Everything is
# optional: without a [feed.work] table `claude` starts in your home directory
# with a built-in prompt that lists the items and asks for a summary and a plan.
# Remove the leading "# " from the lines below to customise it.
#
# - cwd: GitHub and Bitbucket items carry a `Repo` field, the repository name
#   from `where` ("platform-ui" for acme/platform-ui#571). Jira
#   items have none, and a directory that does not exist falls back to the
#   job's cwd or your home directory. {{item.*}} is the FIRST marked item.
# - submit / prefill: by default the agent starts with no prompt and the prompt is
#   typed into its input box without Enter, so you can add to it. prefill =
#   "mention" types only `@<prompt file>` instead of the whole text.
# - prompt: inline here, or `prompt_file = "work.md"` next to this file.
# - Variables: {{items}} {{items_json}} {{count}} {{date}} {{job.id}}
#   {{job.title}} {{feed.title}} {{item.title}} {{item.url}} {{item.badge}}
#   {{item.field.<label>}} ... (see the Jobs docs).
#
# [feed.work]
# agent_command = "claude"
# cwd = "~/code/work/{{item.field.repo}}"
# tab_title = "workbox · {{count}} items"
# submit = false     # default: the prompt waits in Claude's input box as a draft;
#                    # add your note and press Enter. true runs it at once.
# prompt = """
# Today is {{date}}. I picked {{count}} items from my workbox list to work on:
#
# {{items}}
#
# Read each link first, then say in one line what each item needs.
# - GitHub and Bitbucket pull requests: review them (/review-pr for GitHub PRs).
# - Jira mentions and tickets: work out what is being asked of me (/reply-ticket
#   drafts the answer, /ticket-mentions goes through the mentions).
# - Anything else: summarize it and suggest a next step.
#
# Propose a plan and ask before changing code, posting a comment or marking
# anything done (`workbox mark <id> done` uses the Id shown for each item).
# """

# After a sync that changed something, ask whether to start Claude on the
# items. Nothing starts until you answer: a toast and an entry in the Jobs
# overlay's Decisions tab (prefix+t, then tab) offer Start, Snooze and
# Dismiss. Start opens a tab in `cwd` titled `tab_title` and runs
# `agent_command` with prompt.md rendered next to this file: {{count}} is the
# feed's unread count and {{feed_json}} the feed as JSON. The rendered prompt
# is stored under <state dir>/jobs/workbox-sync/handoffs/ and passed as
# `claude "$(cat <file>)"`. Use `agent_command = "claude --some-flag {prompt_file}"`
# if your agent reads the prompt from a file.
[handoff]
when = "on_change"                  # the sync's output or the feed changed since last time
ask = "{{count}} items need you. Start Claude?"
agent_command = "claude"
cwd = "~/Desktop/poc/workbox"
tab_title = "workbox · {{date}}"
prompt_file = "prompt.md"
